---
- name: Ensure personal Codex agent and launcher directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ codex_user_home }}/agents"
    - "{{ codex_install_dir }}"

- name: Install the cross-repository Codex launcher
  ansible.builtin.copy:
    src: codex-repos
    dest: "{{ codex_install_dir }}/codex-repos"
    mode: "0755"

- name: Install the code graph workspace indexer
  ansible.builtin.copy:
    src: codex-index-workspace
    dest: "{{ codex_install_dir }}/codex-index-workspace"
    mode: "0755"

- name: Configure global tool routing and workspace guidance
  ansible.builtin.import_tasks: graph-workspaces.yml

- name: Install the lightweight Codex scout
  ansible.builtin.copy:
    src: workenv-scout.toml
    dest: "{{ codex_user_home }}/agents/workenv-scout.toml"
    mode: "0644"

- name: Install the global Codex skills
  ansible.builtin.copy:
    src: skills/
    dest: "{{ ansible_facts['env'].HOME }}/.agents/skills/"
    directory_mode: "0755"
    mode: "0644"

- name: Configure the GitLab MCP server
  ansible.builtin.import_tasks: gitlab-mcp.yml
  when:
    - codex_gitlab_mcp_url | length > 0
    - not ansible_check_mode

- name: Manage the Elephant–Goldfish plugin
  ansible.builtin.import_tasks: elephant-goldfish.yml
  when:
    - codex_egm_enabled | bool
    - not ansible_check_mode
  vars:
    codex_egm_cli: >-
      {{ homebrew_prefix + '/bin/codex' if ansible_facts['system'] == 'Darwin'
         else codex_install_dir + '/codex' }}
  environment:
    CODEX_HOME: "{{ codex_user_home }}"
