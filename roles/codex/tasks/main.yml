---
# Install codex (OpenAI Codex CLI).
#   - macOS: Homebrew cask (Homebrew ensured by the `homebrew` role dependency)
#   - Linux: official standalone installer -> codex_install_dir

- name: Install codex (macOS, Homebrew cask)
  community.general.homebrew_cask:
    name: "{{ codex_brew_cask }}"
    state: latest
    update_homebrew: true
    path: "{{ homebrew_prefix }}/bin"
  when: ansible_facts['system'] == "Darwin"

- name: Install codex on Linux (standalone installer)
  ansible.builtin.import_tasks: install-linux.yml
  when: ansible_facts['system'] == "Linux"
