---
# Default variables for the codex role.

# Linux: resolve the latest stable release on each run, or pin a version.
codex_version: "latest"

# Official standalone installer for Linux.
codex_install_url: "https://chatgpt.com/codex/install.sh"

# Per-user directory for the Linux command symlinks. No sudo is needed.
codex_install_dir: "{{ ansible_facts['env'].HOME }}/.local/bin"

# macOS: Codex is distributed as a Homebrew cask.
codex_brew_cask: "codex"

# The CLI loads user agents from this directory.
codex_user_home: >-
  {{ ansible_facts['env'].CODEX_HOME
     | default(ansible_facts['env'].HOME + '/.codex', true) }}

# Install Google's Elephant–Goldfish plugin for on-demand design and review.
codex_egm_enabled: true

# Absolute paths to multi-repo workspaces that should share graph guidance.
codex_graph_workspaces: []

# Optional HTTPS endpoint for the GitLab instance's native MCP server.
codex_gitlab_mcp_url: ""

# The bridge handles GitLab discovery separately from the Codex HTTP client.
codex_gitlab_mcp_remote_version: "0.17.2"
