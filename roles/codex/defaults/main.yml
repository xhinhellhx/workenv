---
# Default variables for the codex role.

# Linux: resolve the latest stable release on each run, or pin a version.
codex_version: "latest"

# Official standalone installer for Linux.
codex_install_url: "https://chatgpt.com/codex/install.sh"

# Per-user directory for the Linux command symlinks. No sudo is needed.
codex_install_dir: "{{ ansible_facts['env'].HOME }}/.local/bin"

# macOS: Codex is distributed as a Homebrew cask.
codex_brew_cask: "codex"
