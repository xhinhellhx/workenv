---
- name: Check and repair the Codex code graph registration
  vars:
    codebase_memory_mcp_codex_bin_dir: >-
      {{ homebrew_prefix + '/bin' if ansible_facts['system'] == 'Darwin'
         else codex_install_dir
         | default(ansible_facts['env'].HOME + '/.local/bin') }}
  environment:
    CODEX_HOME: >-
      {{ codex_user_home | default(ansible_facts['env'].CODEX_HOME
         | default(ansible_facts['env'].HOME + '/.codex', true)) }}
  block:
    - name: Install the Codex code graph launcher
      ansible.builtin.copy:
        src: codex-codebase-memory
        dest: "{{ codebase_memory_mcp_bin | dirname }}/codex-codebase-memory"
        mode: "0755"

    - name: Inspect the existing Codex graph registration
      ansible.builtin.command:
        argv:
          - "{{ codebase_memory_mcp_codex_bin_dir }}/codex"
          - mcp
          - get
          - codebase-memory-mcp
          - --json
      register: codebase_memory_mcp_codex_entry
      failed_when: >-
        codebase_memory_mcp_codex_entry.rc != 0 and
        'No MCP server named' not in codebase_memory_mcp_codex_entry.stderr
      changed_when: false

    - name: Register the launcher for new or stock Codex graph entries
      ansible.builtin.command:
        argv:
          - "{{ codebase_memory_mcp_codex_bin_dir }}/codex"
          - mcp
          - add
          - codebase-memory-mcp
          - --
          - "{{ codebase_memory_mcp_bin | dirname }}/codex-codebase-memory"
          - "{{ codebase_memory_mcp_bin }}"
      when: >-
        not codebase_memory_mcp_existing or
        (codebase_memory_mcp_existing.enabled | bool and
         codebase_memory_mcp_transport.command | default('')
         == codebase_memory_mcp_bin and
         not codebase_memory_mcp_transport.args and
         not codebase_memory_mcp_transport.cwd and
         not codebase_memory_mcp_transport.env and
         not codebase_memory_mcp_transport.env_vars and
         not codebase_memory_mcp_existing.startup_timeout_sec and
         not codebase_memory_mcp_existing.tool_timeout_sec and
         not codebase_memory_mcp_existing.enabled_tools and
         not codebase_memory_mcp_existing.disabled_tools)
      vars:
        codebase_memory_mcp_existing: >-
          {{ codebase_memory_mcp_codex_entry.stdout
             | default('{}', true) | from_json }}
        codebase_memory_mcp_transport: >-
          {{ codebase_memory_mcp_existing.transport }}
      changed_when: true
