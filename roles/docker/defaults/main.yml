---
# Default variables for the docker role.

# macOS: install the Docker CLI and the Colima runtime as Homebrew *formulae*
# (no Docker Desktop). Casks install a .app and require an authentication
# prompt that breaks the non-interactive playbook; formulae do not.
docker_brew_formulae:
  - docker
  - docker-compose
  - docker-buildx
  - colima
  # Without Docker Desktop nothing ships docker-credential-osxkeychain, so
  # `docker login` would persist base64 plaintext creds in config.json. This
  # formula installs docker-credential-osxkeychain (the helper for
  # docker_creds_store below).
  - docker-credential-helper

# macOS: directory registered in ~/.docker/config.json's cliPluginsExtraDirs so
# the docker CLI discovers Homebrew-installed plugins (`docker compose`,
# `docker buildx`, ...). Every Homebrew docker plugin formula drops its binary
# here. On Linux the RPM repository or get.docker.com script installs the
# equivalent *-plugin packages system-wide, so this is macOS-only.
docker_cli_plugins_dir: "{{ homebrew_prefix }}/lib/docker/cli-plugins"

# macOS: credential store written to ~/.docker/config.json's `credsStore`. With
# "osxkeychain" the docker CLI stores registry credentials in the macOS Keychain
# (via docker-credential-osxkeychain) instead of base64-encoded in config.json.
# Requires the docker-credential-helper formula above to be on PATH.
docker_creds_store: "osxkeychain"

# macOS: Colima mounts passed during startup. Colima persists these into the
# default profile because `colima start` enables `--save-config` by default.
docker_colima_mounts:
  - /Volumes:w

# Linux: users added to the `docker` group (to run docker without sudo).
docker_users:
  - "{{ ansible_facts['user_id'] }}"

# RHEL family: Rocky/AlmaLinux use Docker's CentOS repository; RHEL uses its own.
docker_rpm_repository_url: >-
  https://download.docker.com/linux/{{ 'rhel' if ansible_facts['distribution'] == 'RedHat' else 'centos' }}
docker_rpm_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Other Linux distributions: official convenience script.
docker_install_url: "https://get.docker.com"
